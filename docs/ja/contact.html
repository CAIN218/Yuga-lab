    </head>
    <body class="page-contact">
        <div id="custom-parallax-bg"></div>
        <div id="wrapper">
            <header class="global-header" style="opacity: 1 !important; transform: translateY(0) !important; pointer-events: auto !important;">
                <a href="index.html" class="header-logo-svg-wrapper">
                        <svg class="header-signature-svg" viewBox="0 0 160 45" xmlns="http://www.w3.org/2000/svg">
                            <polygon points="5,12 12,6 19,12 12,18" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linejoin="round" />
                            <path d="M 5,12 C -2,26 28,38 70,38 L 155,38" fill="none" stroke="url(#line-fade)" stroke-width="1" stroke-linecap="round" />
                            <defs>
                                <linearGradient id="line-fade" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
                                    <stop offset="70%" stop-color="rgba(255,255,255,0.25)" />
                                    <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                                </linearGradient>
                            </defs>
                            <text x="28" y="32" class="signature-text-node">Yuga's Lab.</text>
                        </svg>
                    </a>
                <div class="header-right">
                    <nav class="header-links">
                        <a href="index.html#news">News</a>
                        <a href="index.html#apps">Apps</a>
                        <a href="index.html#about">About</a>
                        <a href="contact.html">Contact</a>
                    </nav>
                    <a href="../contact.html" class="lang-link" hreflang="en">English</a>
                    <button class="menu-trigger-btn" id="menu-open" aria-label="Open menu"><span></span><span></span></button>
                </div>
            </header>

            <nav class="side-nav" id="side-nav">
                <button class="side-nav-close" id="menu-close" aria-label="メニューを閉じる">✕</button>
                <ul class="side-menu-list">
                    <div class="side-menu-section">
                        <span class="side-menu-category">Menu</span>
                        <div class="side-menu-item"><a href="index.html" class="side-menu-link">Home</a></div>
                        <div class="side-menu-item"><a href="index.html#news" class="side-menu-link">News</a></div>
                        <div class="side-menu-item"><a href="index.html#about" class="side-menu-link">About</a></div>
                        <div class="side-menu-item"><a href="contact.html" class="side-menu-link">Contact</a></div>
                    </div>
                    <div class="side-menu-section">
                        <span class="side-menu-category">Apps</span>
                        <div class="side-menu-item"><a href="lumina.html" class="side-menu-link">Lumina</a></div>
                        <div class="side-menu-item"><a href="audioswitcher.html" class="side-menu-link">AudioSwitcher</a></div>
                        <div class="side-menu-item"><a href="meatcam.html" class="side-menu-link">MeatCam <span class="nav-badge active">開発中</span></a></div>
                    </div>
                </ul>
            </nav>

            <div id="main">
                <div class="contact-card">
                    <a href="index.html" class="card-back-btn">← 戻る</a>
                    <h1>Contact</h1>
                    <span class="subtitle">ご質問や不具合の報告、ご感想などお気軽にどうぞ。</span>
                    <form action="https://formspree.io/f/xkoldvjp" method="POST">
                        <div class="form-group">
                            <label for="name">お名前</label>
                            <input type="text" id="name" name="name" class="form-control" required placeholder="山田 太郎">
                        </div>
                        <div class="form-group">
                            <label for="email">メールアドレス</label>
                            <input type="email" id="email" name="_replyto" class="form-control" required placeholder="you@example.com">
                        </div>
                        <div class="form-group">
                            <label for="message">メッセージ</label>
                            <textarea id="message" name="message" class="form-control" required placeholder="お問い合わせ内容をご記入ください"></textarea>
                        </div>
                        <div class="action-container">
                            <button type="submit" class="submit-btn">送信する</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script src="../assets/js/site.js"></script>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                var sideNav = document.getElementById('side-nav');
                document.getElementById('menu-open').addEventListener('click', function() { sideNav.classList.add('open'); });
                document.getElementById('menu-close').addEventListener('click', function() { sideNav.classList.remove('open'); });
                document.addEventListener('click', function(e) { if (!sideNav.contains(e.target) && !document.getElementById('menu-open').contains(e.target)) sideNav.classList.remove('open'); });

                var langDropdown = document.getElementById('lang-dropdown');
                var langDropdownTrigger = document.getElementById('lang-dropdown-trigger');
                if (langDropdown && langDropdownTrigger) {
                    langDropdownTrigger.addEventListener('click', function(e) {
                        e.stopPropagation();
                        langDropdown.classList.toggle('open');
                    });
                    document.addEventListener('click', function(e) {
                        if (!langDropdown.contains(e.target)) langDropdown.classList.remove('open');
                    });
                }
            });
        </script>
    </body>
</html>
